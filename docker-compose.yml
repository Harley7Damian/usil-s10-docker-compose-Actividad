services:
  streamlit:
    image: python:3.11-slim
    container_name: campus_os_streamlit

    working_dir: /app

    ports:
      - "8501:8501"

    environment:
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: campus_notion

    volumes:
      - ./streamlit:/app
      - ./streamlit/uploads:/app/uploads

    depends_on:
      - mongo

    command: >
      bash -c "
      pip install -r requirements.txt &&
      streamlit run app.py --server.address=0.0.0.0
      "

  mongo:
    image: mongo:7
    container_name: campus_os_mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
